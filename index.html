<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SΔM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础变量定义（莫兰迪色系） */
        :root {
            --morandi-gray: #9b979c;
            --morandi-pink: #d4b5b0;
            --morandi-blue: #a9b7c0;
            --morandi-green: #b5b991;
            --morandi-purple: #b39cba;
            --text-light: #f0f0f0;
            --text-dark: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            cursor: default;
            min-height: 100vh;
        }

        /* 全屏背景样式 */
        .fullscreen-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: background-image 1s ease-in-out;
            filter: brightness(0.75);
        }

        /* 主容器布局 */
        .main-container {
            display: flex;
            min-height: 100vh;
            padding: 2rem 2rem 2rem 0;
            gap: 2rem;
        }

        /* 左侧导航栏样式 */
        .left-nav {
            flex: 0 0 180px;
            padding: 3.5rem 0 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            color: var(--text-light);
            position: relative;
            z-index: 2;
        }

        .site-title {
            margin-bottom: 2rem;
        }

        #site-logo {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        #site-logo:hover {
            transform: scale(1.05);
            color: var(--morandi-pink);
        }

        .project-list {
            list-style: none;
        }

        .project-item {
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            padding-left: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .project-item:hover {
            transform: translateX(3px);
            opacity: 1;
        }

        .project-item.active {
            font-weight: 500;
            opacity: 1;
        }

        /* 右侧内容区域样式 */
        .right-content {
            flex: 1;
            padding: 2rem 4rem 2rem 0;
            margin-left: 15%;
            display: block;
            position: relative;
            z-index: 2;
            max-width: calc(100% - 150px);
            overflow-y: auto;
            max-height: calc(100vh - 4rem);
        }

        /* 内容容器通用样式 */
        .content-wrapper {
            width: 100%;
            max-width: 1400px;
            padding: 1rem 0;
            display: none;
        }

        .content-wrapper.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 剪纸容器样式 */
        .cut-paper-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 8rem);
            display: block;
            margin-top: 2rem;
            z-index: 1;
        }

        /* 单张剪纸样式 */
        .cut-paper-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 25%;
            max-width: none;
            height: auto;
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        .cut-paper-img {
            width: 100%;
            height: auto;
            border-radius: 2px;
        }

        /* 漫画板块样式 */
        .comic-main {
            width: 100%;
        }

        .comic-featured {
            position: relative;
            margin: 6rem auto 3rem 12rem;
            cursor: pointer;
            max-width: 600px;
        }

        .comic-featured-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 4px;
            box-shadow: none !important;
            transition: transform 0.3s ease;
        }

        .comic-featured:hover .comic-featured-img {
            transform: translateY(-5px);
        }

        .comic-info {
            display: none;
        }

        /* 电影板块样式 */
        .film-gallery {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            padding: 2rem 0;
        }

        .film-item {
            width: 100%;
            transition: transform 0.3s ease, opacity 0.6s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .film-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .film-item:hover {
            transform: translateY(-8px);
        }

        .film-item img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .film-title {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-top: 1rem;
            text-align: center;
            opacity: 0.9;
        }

        .film-item a {
            text-decoration: none;
        }

        /* 绘画/摄影瀑布流布局 */
        .masonry-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-gap: 2rem;
            grid-auto-flow: dense;
            padding: 2rem 0;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            transition: all 0.6s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .masonry-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .masonry-item:hover {
            transform: translateY(-5px);
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: filter 0.3s ease;
        }

        .masonry-item:hover img {
            filter: brightness(1.05);
        }

        /* 记事本样式 */
        .notebook {
            max-width: 1000px;
            margin: 0 0 2rem 0;
            color: var(--text-light);
        }

        .note {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .note-date {
            font-size: 0.8rem;
            color: var(--morandi-pink);
            margin-bottom: 0.3rem;
        }

        /* 关于我样式 */
        .profile {
            max-width: 1000px;
            margin: 0;
            color: var(--text-light);
        }

        .profile h3 {
            font-size: 1rem;
            margin-bottom: 0.8rem;
            font-weight: 400;
            color: var(--morandi-blue);
        }

        /* 漫画目录样式 */
        .comic-directory {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            box-shadow: none !important;
        }

        .comic-dir-title {
            color: var(--text-light);
            font-size: 1.8rem;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .comic-chapter-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
        }

        .comic-chapter-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 8px;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: none !important;
        }

        .comic-chapter-item:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .comic-dir-close {
            position: absolute;
            top: 2rem;
            right: 3rem;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: none !important;
        }

        .comic-dir-close:hover {
            transform: rotate(90deg);
        }

        /* 漫画阅读区样式 */
        .comic-reader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-shadow: none !important;
        }

        .comic-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 1rem;
            color: var(--text-light);
            box-shadow: none !important;
        }

        .comic-page-info {
            font-size: 1rem;
            opacity: 0.8;
            box-shadow: none !important;
        }

        .comic-back-btn {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-light);
            padding: 0.6rem 1.5rem;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: none !important;
        }

        .comic-back-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .comic-display {
            position: relative;
            width: 100%;
            height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;
        }

        /* 左右双图无缝拼合样式 */
        .comic-page-container {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            gap: 0 !important;
            padding: 0;
            margin: 0;
            box-shadow: none !important;
        }

        .comic-page-left, .comic-page-right {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
            margin: 0 !important;
            position: relative;
            box-shadow: none !important;
        }

        .comic-page {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block !important;
            border: 0;
            outline: 0;
            box-shadow: none !important;
        }

        .comic-page-left .comic-page,
        .comic-page-right .comic-page {
            box-shadow: none !important;
        }

        .comic-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: none;
            color: var(--text-light);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
            font-size: 1.5rem;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            box-shadow: none !important;
        }

        .prev-btn {
            left: 2rem;
        }

        .next-btn {
            right: 2rem;
        }

        .comic-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .comic-btn:not(:disabled):hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* 全屏查看弹窗样式 */
        .fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-shadow: none !important;
        }

        .fullscreen-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: none !important;
        }

        .close-fullscreen {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            z-index: 10;
            box-shadow: none !important;
        }

        .close-fullscreen:hover {
            transform: rotate(90deg);
        }

        /* 响应式布局 */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                gap: 2rem;
                padding: 1rem;
            }

            .left-nav {
                flex: none;
                padding: 1.5rem;
                margin-bottom: 1rem;
                align-items: center;
            }

            .site-title {
                margin-bottom: 1.5rem;
            }

            .project-list {
                display: flex;
                flex-wrap: wrap;
                gap: 1.5rem;
                justify-content: center;
            }

            .project-item {
                margin-bottom: 0;
            }

            .right-content {
                flex: none;
                padding: 1rem;
                margin-left: 0;
                max-width: 100%;
                max-height: none;
                overflow-y: visible;
            }

            .comic-featured {
                margin: 2rem auto;
                max-width: 90%;
            }

            .comic-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .comic-page-container {
                flex-direction: row;
                width: 90%;
                box-shadow: none !important;
            }

            .mobile-single .comic-page-left {
                flex: none;
                width: 100%;
                box-shadow: none !important;
            }

            .mobile-single .comic-page-right {
                display: none;
                box-shadow: none !important;
            }

            .mobile-single .comic-page {
                box-shadow: none !important;
            }

            .film-gallery {
                gap: 2rem;
            }

            .masonry-gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                grid-gap: 1.5rem;
            }

            .comic-controls {
                flex-wrap: wrap;
                gap: 1rem;
                justify-content: center;
            }

            .comic-back-btn {
                margin-top: 1rem;
            }

            .cut-paper-container {
                height: calc(100vh - 12rem);
            }

            .cut-paper-item {
                width: 80%;
            }

            .comic-chapter-list {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- 全屏背景 -->
    <div class="fullscreen-bg" style="background-image: url('images/beijing/initial.jpg');"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧导航区 -->
        <nav class="left-nav">
            <div class="site-title">
                <h1 id="site-logo">SΔM</h1>
            </div>
            
            <ul class="project-list">
                <li class="project-item" data-project="comic">comic</li>

            </ul>
        </nav>

        <!-- 右侧内容区 -->
        <div class="right-content" id="rightContent">
            <!-- 初始页：剪纸 -->
            <div class="cut-paper-container" id="cutPaperContainer">
                <div class="cut-paper-item" data-index="0"><img src="images/cut-paper/1.png" alt="剪纸1" class="cut-paper-img"></div>
                <div class="cut-paper-item" data-index="1"><img src="images/cut-paper/2.png" alt="剪纸2" class="cut-paper-img"></div>
                <div class="cut-paper-item" data-index="2"><img src="images/cut-paper/3.png" alt="剪纸3" class="cut-paper-img"></div>
                <div class="cut-paper-item" data-index="3"><img src="images/cut-paper/4.png" alt="剪纸4" class="cut-paper-img"></div>
                <div class="cut-paper-item" data-index="4"><img src="images/cut-paper/5.png" alt="剪纸5" class="cut-paper-img"></div>
                <div class="cut-paper-item" data-index="5"><img src="images/cut-paper/6.png" alt="剪纸6" class="cut-paper-img"></div>
                <div class="cut-paper-item" data-index="6"><img src="images/cut-paper/7.png" alt="剪纸7" class="cut-paper-img"></div>

            <div id="comic-content" class="content-wrapper">

                    <div class="comic-featured">

                        <div class="comic-info">
                            <h2 class="comic-title">回忆</h2>

            </div>

            <!-- 绘画内容 -->

                    <div class="masonry-item"><img src="images/painting/work4.jpg" alt="绘画4" data-src="images/painting/work4.jpg"></div>
                    <div class="masonry-item"><img src="images/painting/work5.jpg" alt="绘画5" data-src="images/painting/work5.jpg"></div>
                    <div class="masonry-item"><img src="images/painting/work6.jpg" alt="绘画6" data-src="images/painting/work6.jpg"></div>
                    <div class="masonry-item"><img src="images/painting/work7.jpg" alt="绘画7" data-src="images/painting/work7.jpg"></div>
                    <div class="masonry-item"><img src="images/painting/work8.jpg" alt="绘画8" data-src="images/painting/work8.jpg"></div>
                    <div class="masonry-item"><img src="images/painting/work9.jpg" alt="绘画9" data-src="images/painting/work9.jpg"></div>
                    <div class="masonry-item"><img src="images/painting/work10.jpg" alt="绘画10" data-src="images/painting/work10.jpg"></div>
                    <div class="masonry-item"><img src="images/painting/work11.jpg" alt="绘画11" data-src="images/painting/work11.jpg"></div>

            </div>

            <!-- 摄影内容 -->
            <div id="photography-content" class="content-wrapper">

    <script>
        // 核心新增：手动触发标记，只有手动点击才能打开漫画
        let isComicManualTrigger = false;

        // 项目配置
        const projects = [
            { id: 'comic', bgImage: 'images/beijing/01.jpg', cursor: 'url("images/cursor/comic-cursor.png"), auto' },
            { id: 'painting', bgImage: 'images/beijing/02.jpg', cursor: 'url("images/cursor/paint-cursor.png"), auto' },
            { id: 'photography', bgImage: 'images/beijing/03.jpg', cursor: 'url("images/cursor/photo-cursor.png"), auto' },
            { id: 'film', bgImage: 'images/beijing/04.jpg', cursor: 'url("images/cursor/film-cursor.png"), auto' },
            { id: 'world', bgImage: 'images/beijing/05.jpg', cursor: 'url("images/cursor/world-cursor.png"), auto' }
        ];

        // 漫画数据
        const comicsData = {
            1: [
                ['images/comic/neiye0.png', 'images/comic/neiye1.png'],
                ['images/comic/neiye2.png', 'images/comic/neiye3.png'],
                ['images/comic/neiye4.png', 'images/comic/neiye5.png'],
                ['images/comic/neiye6.png', 'images/comic/neiye7.png'],
                ['images/comic/neiye8.png', 'images/comic/neiye9.png'],
                ['images/comic/neiye10.png', 'images/comic/neiye11.png'],
                ['images/comic/neiye12.png', 'images/comic/neiye13.png'],
                ['images/comic/neiye14.png', 'images/comic/neiye15.png'],
                ['images/comic/neiye16.png', 'images/comic/neiye17.png'],
                ['images/comic/neiye18.png', 'images/comic/neiye19.png'],
                ['images/comic/neiye20.png', 'images/comic/neiye21.png'],
                ['images/comic/neiye22.png', 'images/comic/neiye23.png'],
                ['images/comic/neiye24.png', 'images/comic/neiye25.png'],
                ['images/comic/neiye26.png', 'images/comic/neiye27.png'],
                ['images/comic/neiye28.png', 'images/comic/neiye29.png'],
                ['images/comic/neiye30.png', 'images/comic/neiye31.png']
            ],
            2: [
                ['images/comic/neiye b0.png', 'images/comic/neiye b1.png'],
                ['images/comic/neiye b2.png', 'images/comic/neiye b3.png'],
                ['images/comic/neiye b4.png', 'images/comic/neiye b5.png'],
                ['images/comic/neiye b6.png', 'images/comic/neiye b7.png'],
                ['images/comic/neiye b8.png', 'images/comic/neiye b9.png'],
                ['images/comic/neiye b10.png', 'images/comic/neiye b11.png'],
                ['images/comic/neiye b12.png', 'images/comic/neiye b13.png'],
                ['images/comic/neiye b14.png', 'images/comic/neiye b15.png'],
                ['images/comic/neiye b16.png', 'images/comic/neiye b17.png'],
                ['images/comic/neiye b18.png', 'images/comic/neiye b19.png'],
                ['images/comic/neiye b20.png', 'images/comic/neiye b21.png'],
                ['images/comic/neiye b22.png', 'images/comic/neiye b23.png'],
                ['images/comic/neiye b24.png', 'images/comic/neiye b25.png'],
                ['images/comic/neiye b26.png', 'images/comic/neiye b27.png'],
                ['images/comic/neiye b28.png', 'images/comic/neiye b29.png'],
                ['images/comic/neiye b30.png', 'images/comic/neiye b31.png']
            ]
        };

        // DOM元素获取
        const bgElement = document.querySelector('.fullscreen-bg');
        const projectItems = document.querySelectorAll('.project-item');
        const contentWrappers = document.querySelectorAll('.content-wrapper');
        const comicFeaturedImg = document.querySelector('.comic-featured-img');
        const comicDirectory = document.getElementById('comic-directory');
        const comicDirClose = document.querySelector('.comic-dir-close');
        const comicChapterItems = document.querySelectorAll('.comic-chapter-item');
        const comicReader = document.getElementById('comic-reader');
        const comicPageLeft = document.querySelector('.comic-page-left .comic-page');
        const comicPageRight = document.querySelector('.comic-page-right .comic-page');
        const pageInfo = document.querySelector('.comic-page-info');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const backBtn = document.querySelector('.comic-back-btn');
        const fullscreenView = document.getElementById('fullscreen-view');
        const fullscreenImg = document.querySelector('.fullscreen-img');
        const closeFullscreen = document.querySelector('.close-fullscreen');
        const galleryImages = document.querySelectorAll('.masonry-item img');
        const cutPaperContainer = document.querySelector('.cut-paper-container');
        const siteLogo = document.getElementById('site-logo');
        const masonryItems = document.querySelectorAll('.masonry-item');
        const filmItems = document.querySelectorAll('.film-item');
        const comicPageContainer = document.querySelector('.comic-page-container');
        const rightContent = document.getElementById('rightContent');

        // 核心修改1：提前绑定全屏事件（页面加载前就生效）
        document.addEventListener('fullscreenchange', (e) => {
            // 阻止所有默认行为和冒泡
            e.stopImmediatePropagation();
            e.preventDefault();
            
            // 强制重置状态：只显示当前内容，绝对不显示漫画
            if (cutPaperContainer.style.display !== 'none') {
                cutPaperContainer.style.display = 'block';
            }
            // 强制隐藏漫画相关元素
            comicReader.style.display = 'none';
            comicDirectory.style.display = 'none';
            // 重置手动触发标记
            isComicManualTrigger = false;
        }, { capture: true }); // 捕获阶段就执行，优先级最高

        // 核心修改2：移除resize中所有漫画相关逻辑
        window.addEventListener('resize', (e) => {
            e.stopPropagation();
            // 只做基础适配，不碰漫画逻辑
            if (comicReader.style.display === 'flex' && isComicManualTrigger) {
                // 仅当手动打开漫画时，才适配尺寸（避免全屏resize触发）
                const isMobileNow = window.innerWidth <= 900;
                comicPageContainer.classList.toggle('mobile-single', isMobileNow);
            }
        });

        // 检测是否为移动端
        function isMobile() {
            return window.innerWidth <= 900;
        }

        // 瀑布流/电影区滚动显现效果
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        masonryItems.forEach(item => observer.observe(item));
        filmItems.forEach(item => observer.observe(item));

        // 点击标题返回初始页
        siteLogo.addEventListener('click', () => {
            contentWrappers.forEach(w => w.classList.remove('active'));
            cutPaperContainer.style.display = 'block';
            bgElement.style.backgroundImage = 'url("images/beijing/initial.jpg")';
            projectItems.forEach(i => i.classList.remove('active'));
            document.body.style.cursor = 'default';
            comicReader.style.display = 'none';
            comicDirectory.style.display = 'none';
            document.body.style.overflow = 'auto';
            comicPageContainer.classList.remove('mobile-single');
            rightContent.scrollTop = 0;
            // 重置手动触发标记
            isComicManualTrigger = false;
        });

        // 项目切换
        projectItems.forEach(item => {
            item.addEventListener('click', () => {
                const project = projects.find(p => p.id === item.dataset.project);
                if (project) {
                    cutPaperContainer.style.display = 'none';
                    document.body.style.overflow = 'auto';
                    bgElement.style.backgroundImage = `url('${project.bgImage}')`;
                    document.body.style.cursor = project.cursor;
                    projectItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    contentWrappers.forEach(w => w.classList.remove('active'));
                    const targetContent = document.getElementById(`${project.id}-content`);
                    targetContent.classList.add('active');
                    rightContent.scrollTop = 0;
                    comicPageContainer.classList.remove('mobile-single');
                    // 重置手动触发标记
                    isComicManualTrigger = false;
                }
            });
        });

        // 剪纸交互
        const cutPaperItems = document.querySelectorAll('.cut-paper-item');
        cutPaperItems.forEach((item, index) => {
            let initX, initY, initRotate, zIndex, width;
            switch(parseInt(item.dataset.index)) {
                case 0:
                    initX = -250; initY = -280; initRotate = 0; zIndex = 2; width = '8%'; break;
                case 1:
                    initX = -160; initY = -210; initRotate = 5; zIndex = 5; width = '10%'; break;
                case 2:
                    initX = -40; initY = -260; initRotate = -3; zIndex = 6; width = '14%'; break;
                case 3:
                    initX = -190; initY = 130; initRotate = 8; zIndex = 4; width = '15%'; break;
                case 4:
                    initX = 40; initY = 50; initRotate = -5; zIndex = 7; width = '27%'; break;
                case 5:
                    initX = 220; initY = 120; initRotate = 10; zIndex = 4; width = '29%'; break;
                case 6:
                    initX = 220; initY = -40; initRotate = -8; zIndex = 3; width = '16%'; break;
                case 7:
                    initX = -190; initY = -40; initRotate = -9; zIndex = 1; width = '40%'; break;
                case 8:
                    initX = 130; initY = -110; initRotate = -3; zIndex = 2; width = '32%'; break;
                case 9:
                    initX = 220; initY = -210; initRotate = -10; zIndex = 1; width = '23%'; break;
                default:
                    initX = 0; initY = 0; initRotate = 0; zIndex = 0; width = '25%';
            }
            item.style.transform = `translate(-50%, -50%) translate(${initX}px, ${initY}px) rotate(${initRotate}deg)`;
            item.style.zIndex = zIndex;
            item.style.width = width;

            item.addEventListener('mouseenter', () => {
                const moveX = Math.random() * 30 - 15;
                const moveY = Math.random() * 30 - 15;
                const rotate = Math.random() * 10 - 5;
                item.style.transform = `translate(-50%, -50%) translate(${moveX}px, ${moveY}px) rotate(${rotate}deg)`;
                item.style.filter = 'brightness(1.1)';
            });
            item.addEventListener('mouseleave', () => {
                item.style.transform = `translate(-50%, -50%) translate(${initX}px, ${initY}px) rotate(${initRotate}deg)`;
                item.style.filter = 'brightness(1)';
            });
        });

        // 漫画相关变量
        let currentComicId = '1';
        let currentPage = 0;
        let currentComicPages = [];
        let mobileSinglePages = [];
        let currentMobileIndex = 0;

        // 核心修改3：打开漫画目录时标记为手动触发
        comicFeaturedImg.addEventListener('click', () => {
            isComicManualTrigger = true; // 标记为手动操作
            comicDirectory.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });

        // 关闭漫画目录
        comicDirClose.addEventListener('click', () => {
            comicDirectory.style.display = 'none';
            document.body.style.overflow = 'auto';
            isComicManualTrigger = false;
        });

        // 转换双图数组为单图数组
        function convertToSinglePages(doublePages) {
            const singlePages = [];
            doublePages.forEach(pair => {
                if (pair[0]) singlePages.push(pair[0]);
                if (pair[1]) singlePages.push(pair[1]);
            });
            return singlePages;
        }

        // 选择漫画章节（手动触发标记）
        comicChapterItems.forEach(item => {
            item.addEventListener('click', () => {
                isComicManualTrigger = true; // 标记为手动操作
                currentComicId = item.dataset.chapter;
                openComicReader(currentComicId);
                comicDirectory.style.display = 'none';
            });
        });

        // 打开漫画阅读器（仅手动触发时生效）
        function openComicReader(id) {
            if (!isComicManualTrigger) return; // 非手动操作直接返回
            currentComicPages = comicsData[id] || [];
            
            if (isMobile()) {
                mobileSinglePages = convertToSinglePages(currentComicPages);
                currentMobileIndex = 0;
                comicPageContainer.classList.add('mobile-single');
            } else {
                currentPage = 0;
                comicPageContainer.classList.remove('mobile-single');
            }
            
            comicReader.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            loadComicPage();
        }

        // 加载漫画页面
        function loadComicPage() {
            if (!isComicManualTrigger) return; // 非手动操作直接返回
            if (isMobile()) {
                if (mobileSinglePages.length === 0) return;
                comicPageLeft.src = mobileSinglePages[currentMobileIndex];
                comicPageRight.src = '';
                comicPageLeft.parentElement.style.display = 'flex';
                comicPageRight.parentElement.style.display = 'none';
                pageInfo.textContent = `第 ${currentMobileIndex + 1} / ${mobileSinglePages.length} 页`;
                prevBtn.disabled = currentMobileIndex === 0; 
                nextBtn.disabled = currentMobileIndex === mobileSinglePages.length - 1;
            } else {
                if (currentComicPages.length === 0) return;
                const [leftSrc, rightSrc] = currentComicPages[currentPage];
                comicPageLeft.src = leftSrc || '';
                comicPageRight.src = rightSrc || '';
                comicPageLeft.parentElement.style.display = leftSrc ? 'flex' : 'none';
                comicPageRight.parentElement.style.display = rightSrc ? 'flex' : 'none';
                pageInfo.textContent = `第 ${currentPage + 1} / ${currentComicPages.length} 页`;
                prevBtn.disabled = currentPage === 0; 
                nextBtn.disabled = currentPage === currentComicPages.length - 1;
            }
        }

        // 漫画翻页
        prevBtn.addEventListener('click', () => { 
            if (!isComicManualTrigger) return;
            if (isMobile()) {
                if (currentMobileIndex > 0) {
                    currentMobileIndex--;
                    loadComicPage();
                }
            } else {
                if (currentPage > 0) { 
                    currentPage--; 
                    loadComicPage(); 
                }
            }
        });

        nextBtn.addEventListener('click', () => { 
            if (!isComicManualTrigger) return;
            if (isMobile()) {
                if (currentMobileIndex < mobileSinglePages.length - 1) {
                    currentMobileIndex++;
                    loadComicPage();
                }
            } else {
                if (currentPage < currentComicPages.length - 1) { 
                    currentPage++; 
                    loadComicPage(); 
                }
            }
        });

        // 关闭漫画阅读
        backBtn.addEventListener('click', () => { 
            comicReader.style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
            comicPageContainer.classList.remove('mobile-single');
            comicDirectory.style.display = 'flex';
            isComicManualTrigger = false;
        });

        // 键盘操作
        document.addEventListener('keydown', (e) => {
            if (comicReader.style.display === 'flex' && isComicManualTrigger) {
                if (isMobile()) {
                    if (e.key === 'ArrowLeft' && currentMobileIndex > 0) {
                        currentMobileIndex--;
                        loadComicPage();
                    } else if (e.key === 'ArrowRight' && currentMobileIndex < mobileSinglePages.length - 1) {
                        currentMobileIndex++;
                        loadComicPage();
                    }
                } else {
                    if (e.key === 'ArrowLeft' && currentPage > 0) currentPage--;
                    else if (e.key === 'ArrowRight' && currentPage < currentComicPages.length - 1) currentPage++;
                    loadComicPage();
                }
                
                if (e.key === 'Escape') { 
                    comicReader.style.display = 'none'; 
                    document.body.style.overflow = 'auto'; 
                    comicPageContainer.classList.remove('mobile-single');
                    comicDirectory.style.display = 'flex';
                    isComicManualTrigger = false;
                    return; 
                }
            } else if (comicDirectory.style.display === 'flex') {
                if (e.key === 'Escape') {
                    comicDirectory.style.display = 'none';
                    document.body.style.overflow = 'auto';
                    isComicManualTrigger = false;
                }
            }
        });

        // 作品全屏查看
        galleryImages.forEach(img => {
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                fullscreenImg.src = img.dataset.src || img.src;
                fullscreenView.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                
                if (fullscreenView.requestFullscreen) {
                    fullscreenView.requestFullscreen().catch(err => {
                        console.log('全屏请求失败:', err);
                    });
                }
            });
        });

        // 关闭全屏查看
        closeFullscreen.addEventListener('click', () => {
            fullscreenView.style.display = 'none';
            document.body.style.overflow = 'auto';
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        });

        fullscreenView.addEventListener('click', (e) => {
            if (e.target === fullscreenView) {
                fullscreenView.style.display = 'none';
                document.body.style.overflow = 'auto';
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // 强化初始化：锁死首页状态
        window.addEventListener('DOMContentLoaded', function() {
            // DOM加载完成就锁定，比onload更早
            cutPaperContainer.style.display = 'block';
            contentWrappers.forEach(w => w.classList.remove('active'));
            comicReader.style.display = 'none';
            comicDirectory.style.display = 'none';
            document.body.style.overflow = 'auto';
            isComicManualTrigger = false; // 初始化为非手动
        });

        window.onload = function() {
            // 双重保险：onload再确认一次
            cutPaperContainer.style.display = 'block';
            comicReader.style.display = 'none';
            comicDirectory.style.display = 'none';
            isComicManualTrigger = false;
        };
    </script>
</body>
</html>
